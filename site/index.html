<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>imodb</title>
<script>try { var t = localStorage.getItem('imodb-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=Space+Grotesk:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <a href="#/" class="brand">imodb</a>
  <form id="search-form" class="search" autocomplete="off" role="search">
    <input id="q" type="search" aria-label="Search problems" autofocus>
    <button type="submit">Search</button>
  </form>
  <button type="button" id="theme-toggle" class="ghost" aria-label="Toggle dark mode">☾</button>
</header>

<div class="layout">
<aside id="filters" class="filters" aria-label="Filters">
  <div class="filter">
    <span class="filter-name">Year</span>
    <select id="year-from" aria-label="From year"></select>
    <span class="dash">to</span>
    <select id="year-to" aria-label="To year"></select>
  </div>
  <div class="filter">
    <span class="filter-name">Contest</span>
    <label><input type="checkbox" data-filter="version" value="A" checked> 10A</label>
    <label><input type="checkbox" data-filter="version" value="B" checked> 10B</label>
  </div>
  <div class="filter">
    <span class="filter-name">Problem #</span>
    <input id="num-from" type="number" min="1" max="25" value="1" aria-label="From problem number">
    <span class="dash">to</span>
    <input id="num-to" type="number" min="1" max="25" value="25" aria-label="To problem number">
  </div>
  <div class="filter" id="difficulty-filter">
    <span class="filter-name">Difficulty</span>
  </div>
  <div class="filter" id="category-filter">
    <span class="filter-name">Category</span>
  </div>
  <div class="filter">
    <button type="button" id="reset-filters" class="ghost">Reset filters</button>
  </div>
</aside>

<main id="main">
  <div id="status" class="status" hidden></div>
  <section id="results" hidden></section>
  <article id="problem" hidden></article>
</main>
</div>

<footer class="foot">
  Problems and solutions are from the <a href="https://artofproblemsolving.com/wiki/" target="_blank" rel="noopener">AoPS Wiki</a>.
  <span id="generated"></span>
</footer>

<script src="vendor/katex/katex.min.js"></script>
<script src="app.js"></script>
</body>
</html>
